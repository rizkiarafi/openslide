<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" fill="none">
  <defs>
    <radialGradient id="latticeGlow" cx="80%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <pattern id="dotGrid" width="48" height="48" patternUnits="userSpaceOnUse">
      <circle cx="24" cy="24" r="1.5" fill="#2563eb" fill-opacity="0.07" />
    </pattern>
  </defs>

  <rect width="1920" height="1080" fill="url(#dotGrid)" />
  <circle cx="1500" cy="450" r="550" fill="url(#latticeGlow)" />

  <!-- Isometric 3D Ionic Crystal Lattice Structure (Right side watermark) -->
  <g transform="translate(1380, 220)" stroke="#1d4ed8" stroke-opacity="0.14" stroke-width="2">
    <!-- Layer 1 -->
    <path d="M 0,100 L 140,20 L 280,100 L 140,180 Z" fill="rgba(37, 99, 235, 0.02)" />
    <path d="M 140,20 L 280,-60 L 420,20 L 280,100 Z" fill="rgba(2, 132, 199, 0.02)" />
    <!-- Layer 2 -->
    <path d="M 0,260 L 140,180 L 280,260 L 140,340 Z" fill="rgba(37, 99, 235, 0.02)" />
    <path d="M 140,180 L 280,100 L 420,180 L 280,260 Z" fill="rgba(2, 132, 199, 0.02)" />
    <!-- Vertical Pillars -->
    <line x1="0" y1="100" x2="0" y2="260" />
    <line x1="140" y1="20" x2="140" y2="180" />
    <line x1="280" y1="-60" x2="280" y2="100" />
    <line x1="280" y1="100" x2="280" y2="260" />
    <line x1="420" y1="20" x2="420" y2="180" />
    <line x1="140" y1="180" x2="140" y2="340" />

    <!-- Cation (Na+) & Anion (Cl-) Node Spheres -->
    <!-- Na+ (smaller, darker blue) -->
    <circle cx="0" cy="100" r="9" fill="#1d4ed8" fill-opacity="0.3" stroke="#2563eb" stroke-opacity="0.4" />
    <circle cx="280" cy="100" r="9" fill="#1d4ed8" fill-opacity="0.3" stroke="#2563eb" stroke-opacity="0.4" />
    <circle cx="140" cy="340" r="9" fill="#1d4ed8" fill-opacity="0.3" stroke="#2563eb" stroke-opacity="0.4" />
    <circle cx="280" cy="-60" r="9" fill="#1d4ed8" fill-opacity="0.3" stroke="#2563eb" stroke-opacity="0.4" />
    <circle cx="420" cy="180" r="9" fill="#1d4ed8" fill-opacity="0.3" stroke="#2563eb" stroke-opacity="0.4" />

    <!-- Cl- (larger, lighter cyan) -->
    <circle cx="140" cy="20" r="16" fill="#0284c7" fill-opacity="0.22" stroke="#38bdf8" stroke-opacity="0.3" />
    <circle cx="140" cy="180" r="16" fill="#0284c7" fill-opacity="0.22" stroke="#38bdf8" stroke-opacity="0.3" />
    <circle cx="0" cy="260" r="16" fill="#0284c7" fill-opacity="0.22" stroke="#38bdf8" stroke-opacity="0.3" />
    <circle cx="280" cy="260" r="16" fill="#0284c7" fill-opacity="0.22" stroke="#38bdf8" stroke-opacity="0.3" />
    <circle cx="420" cy="20" r="16" fill="#0284c7" fill-opacity="0.22" stroke="#38bdf8" stroke-opacity="0.3" />
  </g>

  <!-- Corner indicators -->
  <path d="M 60,90 L 60,60 L 90,60" stroke="#0284c7" stroke-opacity="0.2" stroke-width="2" />
  <path d="M 1830,60 L 1860,60 L 1860,90" stroke="#0284c7" stroke-opacity="0.2" stroke-width="2" />
  <path d="M 60,990 L 60,1020 L 90,1020" stroke="#0284c7" stroke-opacity="0.2" stroke-width="2" />
  <path d="M 1830,1020 L 1860,1020 L 1860,990" stroke="#0284c7" stroke-opacity="0.2" stroke-width="2" />
</svg>
