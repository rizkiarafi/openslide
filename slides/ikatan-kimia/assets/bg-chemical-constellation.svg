<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" fill="none">
  <defs>
    <linearGradient id="blueFade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.10" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.02" />
    </linearGradient>
    <radialGradient id="orbGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0" />
    </radialGradient>
    <pattern id="hexGrid" width="120" height="103.92" patternUnits="userSpaceOnUse">
      <path d="M 60,0 L 120,34.64 L 120,103.92 L 60,138.56 L 0,103.92 L 0,34.64 Z" fill="none" stroke="#2563eb" stroke-opacity="0.04" stroke-width="1.2" />
    </pattern>
  </defs>

  <!-- Ambient hexagon lattice watermark -->
  <rect width="1920" height="1080" fill="url(#hexGrid)" />

  <!-- Soft radial ambient glows -->
  <circle cx="1550" cy="280" r="450" fill="url(#orbGlow)" />
  <circle cx="280" cy="850" r="400" fill="url(#orbGlow)" />

  <!-- Molecular constellations & bond lines (Top Right) -->
  <g stroke="#2563eb" stroke-opacity="0.12" stroke-width="2" stroke-dasharray="6 6">
    <line x1="1300" y1="180" x2="1480" y2="120" />
    <line x1="1480" y1="120" x2="1640" y2="220" />
    <line x1="1640" y1="220" x2="1780" y2="150" />
    <line x1="1640" y1="220" x2="1600" y2="380" />
    <line x1="1600" y1="380" x2="1420" y2="440" />
    <line x1="1420" y1="440" x2="1350" y2="340" />
    <line x1="1350" y1="340" x2="1300" y2="180" />
  </g>

  <!-- Atoms / Nodes -->
  <g fill="#2563eb" fill-opacity="0.18">
    <circle cx="1300" cy="180" r="9" />
    <circle cx="1480" cy="120" r="14" fill="#0284c7" fill-opacity="0.22" />
    <circle cx="1640" cy="220" r="18" fill="#1d4ed8" fill-opacity="0.25" />
    <circle cx="1780" cy="150" r="11" />
    <circle cx="1600" cy="380" r="13" />
    <circle cx="1420" cy="440" r="16" fill="#0284c7" fill-opacity="0.22" />
    <circle cx="1350" cy="340" r="10" />
  </g>

  <!-- Orbital electron rings -->
  <ellipse cx="1640" cy="220" rx="64" ry="24" transform="rotate(-25 1640 220)" stroke="#38bdf8" stroke-opacity="0.22" stroke-width="1.5" />
  <ellipse cx="1640" cy="220" rx="64" ry="24" transform="rotate(45 1640 220)" stroke="#2563eb" stroke-opacity="0.2" stroke-width="1.5" />
  <circle cx="1695" cy="205" r="4" fill="#0284c7" fill-opacity="0.4" />

  <!-- Bottom Left Chemical motif -->
  <g stroke="#0284c7" stroke-opacity="0.1" stroke-width="2">
    <line x1="120" y1="920" x2="260" y2="820" />
    <line x1="260" y1="820" x2="420" y2="890" />
    <line x1="420" y1="890" x2="520" y2="780" />
    <line x1="260" y1="820" x2="280" y2="670" stroke-dasharray="4 4" />
  </g>
  <circle cx="120" cy="920" r="8" fill="#2563eb" fill-opacity="0.2" />
  <circle cx="260" cy="820" r="14" fill="#1d4ed8" fill-opacity="0.2" />
  <circle cx="420" cy="890" r="11" fill="#0284c7" fill-opacity="0.25" />
  <circle cx="520" cy="780" r="8" fill="#38bdf8" fill-opacity="0.3" />
  <circle cx="280" cy="670" r="16" fill="#2563eb" fill-opacity="0.15" />
  <ellipse cx="280" cy="670" rx="42" ry="16" transform="rotate(30 280 670)" stroke="#0284c7" stroke-opacity="0.2" stroke-width="1.2" />

  <!-- Delicate corner registration ticks -->
  <path d="M 60,90 L 60,60 L 90,60" stroke="#2563eb" stroke-opacity="0.25" stroke-width="2" />
  <path d="M 1830,60 L 1860,60 L 1860,90" stroke="#2563eb" stroke-opacity="0.25" stroke-width="2" />
  <path d="M 60,990 L 60,1020 L 90,1020" stroke="#2563eb" stroke-opacity="0.25" stroke-width="2" />
  <path d="M 1830,1020 L 1860,1020 L 1860,990" stroke="#2563eb" stroke-opacity="0.25" stroke-width="2" />
</svg>
