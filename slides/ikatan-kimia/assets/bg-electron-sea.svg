<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" fill="none">
  <defs>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.04" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.04" />
    </linearGradient>
  </defs>

  <!-- Flowing electron cloud waves -->
  <path d="M 0,380 C 400,280 800,480 1200,340 C 1500,240 1750,380 1920,320 L 1920,800 C 1600,900 1300,750 900,820 C 500,890 200,780 0,850 Z" fill="url(#waveGrad)" />

  <!-- Metallic Lattice Grid Watermark -->
  <g transform="translate(1300, 480)" fill="#1d4ed8" fill-opacity="0.12">
    <!-- Row 1 -->
    <circle cx="80" cy="80" r="16" />
    <circle cx="200" cy="80" r="16" />
    <circle cx="320" cy="80" r="16" />
    <circle cx="440" cy="80" r="16" />
    <!-- Row 2 -->
    <circle cx="80" cy="200" r="16" />
    <circle cx="200" cy="200" r="16" />
    <circle cx="320" cy="200" r="16" />
    <circle cx="440" cy="200" r="16" />
    <!-- Row 3 -->
    <circle cx="80" cy="320" r="16" />
    <circle cx="200" cy="320" r="16" />
    <circle cx="320" cy="320" r="16" />
    <circle cx="440" cy="320" r="16" />
    <!-- Plus signs on cations -->
    <text x="75" y="85" fill="#1d4ed8" fill-opacity="0.3" font-family="sans-serif" font-size="16" font-weight="bold">+</text>
    <text x="195" y="85" fill="#1d4ed8" fill-opacity="0.3" font-family="sans-serif" font-size="16" font-weight="bold">+</text>
    <text x="315" y="85" fill="#1d4ed8" fill-opacity="0.3" font-family="sans-serif" font-size="16" font-weight="bold">+</text>
    <text x="435" y="85" fill="#1d4ed8" fill-opacity="0.3" font-family="sans-serif" font-size="16" font-weight="bold">+</text>

    <text x="75" y="205" fill="#1d4ed8" fill-opacity="0.3" font-family="sans-serif" font-size="16" font-weight="bold">+</text>
    <text x="195" y="205" fill="#1d4ed8" fill-opacity="0.3" font-family="sans-serif" font-size="16" font-weight="bold">+</text>
    <text x="315" y="205" fill="#1d4ed8" fill-opacity="0.3" font-family="sans-serif" font-size="16" font-weight="bold">+</text>
    <text x="435" y="205" fill="#1d4ed8" fill-opacity="0.3" font-family="sans-serif" font-size="16" font-weight="bold">+</text>

    <text x="75" y="325" fill="#1d4ed8" fill-opacity="0.3" font-family="sans-serif" font-size="16" font-weight="bold">+</text>
    <text x="195" y="325" fill="#1d4ed8" fill-opacity="0.3" font-family="sans-serif" font-size="16" font-weight="bold">+</text>
    <text x="315" y="325" fill="#1d4ed8" fill-opacity="0.3" font-family="sans-serif" font-size="16" font-weight="bold">+</text>
    <text x="435" y="325" fill="#1d4ed8" fill-opacity="0.3" font-family="sans-serif" font-size="16" font-weight="bold">+</text>
  </g>

  <!-- Free delocalized valence electron dots (e-) -->
  <g fill="#0284c7" fill-opacity="0.25">
    <circle cx="1440" cy="540" r="5" />
    <circle cx="1560" cy="530" r="5" />
    <circle cx="1680" cy="550" r="5" />
    <circle cx="1380" cy="660" r="5" />
    <circle cx="1500" cy="650" r="5" />
    <circle cx="1620" cy="670" r="5" />
    <circle cx="1740" cy="660" r="5" />
    <circle cx="1450" cy="780" r="5" />
    <circle cx="1570" cy="790" r="5" />
    <circle cx="1690" cy="770" r="5" />
  </g>

  <!-- Corner indicators -->
  <path d="M 60,90 L 60,60 L 90,60" stroke="#2563eb" stroke-opacity="0.2" stroke-width="2" />
  <path d="M 1830,60 L 1860,60 L 1860,90" stroke="#2563eb" stroke-opacity="0.2" stroke-width="2" />
  <path d="M 60,990 L 60,1020 L 90,1020" stroke="#2563eb" stroke-opacity="0.2" stroke-width="2" />
  <path d="M 1830,1020 L 1860,1020 L 1860,990" stroke="#2563eb" stroke-opacity="0.2" stroke-width="2" />
</svg>
