<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" fill="none">
  <defs>
    <radialGradient id="purpleGlow1" cx="80%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#9333ea" stop-opacity="0.10" />
      <stop offset="60%" stop-color="#c084fc" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="purpleGlow2" cx="15%" cy="85%" r="50%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.08" />
      <stop offset="65%" stop-color="#a855f7" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <pattern id="hexGridPurple" width="120" height="103.92" patternUnits="userSpaceOnUse">
      <path d="M 60,0 L 120,34.64 L 120,103.92 L 60,138.56 L 0,103.92 L 0,34.64 Z" fill="none" stroke="#7c3aed" stroke-opacity="0.05" stroke-width="1.2" />
    </pattern>
  </defs>

  <!-- Ambient hexagon lattice watermark -->
  <rect width="1920" height="1080" fill="url(#hexGridPurple)" />

  <!-- Soft radial ambient glows -->
  <circle cx="1550" cy="240" r="480" fill="url(#purpleGlow1)" />
  <circle cx="280" cy="850" r="420" fill="url(#purpleGlow2)" />

  <!-- Molecular constellations & bond lines (Top Right) -->
  <g stroke="#7c3aed" stroke-opacity="0.16" stroke-width="2" stroke-dasharray="6 6">
    <line x1="1320" y1="180" x2="1480" y2="120" />
    <line x1="1480" y1="120" x2="1640" y2="220" />
    <line x1="1640" y1="220" x2="1780" y2="150" />
    <line x1="1640" y1="220" x2="1600" y2="380" />
    <line x1="1600" y1="380" x2="1440" y2="440" />
    <line x1="1440" y1="440" x2="1350" y2="340" />
    <line x1="1350" y1="340" x2="1320" y2="180" />
  </g>

  <!-- Atoms / Nodes -->
  <g fill="#7c3aed" fill-opacity="0.22">
    <circle cx="1320" cy="180" r="10" />
    <circle cx="1480" cy="120" r="15" fill="#9333ea" fill-opacity="0.25" />
    <circle cx="1640" cy="220" r="20" fill="#6d28d9" fill-opacity="0.30" />
    <circle cx="1780" cy="150" r="12" />
    <circle cx="1600" cy="380" r="14" />
    <circle cx="1440" cy="440" r="18" fill="#9333ea" fill-opacity="0.25" />
    <circle cx="1350" cy="340" r="11" />
  </g>

  <!-- Orbital electron rings -->
  <ellipse cx="1640" cy="220" rx="72" ry="28" transform="rotate(-25 1640 220)" stroke="#c084fc" stroke-opacity="0.30" stroke-width="1.8" />
  <ellipse cx="1640" cy="220" rx="72" ry="28" transform="rotate(45 1640 220)" stroke="#7c3aed" stroke-opacity="0.25" stroke-width="1.8" />
  <circle cx="1705" cy="202" r="4.5" fill="#9333ea" fill-opacity="0.5" />

  <!-- Bottom Left Chemical motif -->
  <g stroke="#9333ea" stroke-opacity="0.14" stroke-width="2">
    <line x1="120" y1="920" x2="260" y2="820" />
    <line x1="260" y1="820" x2="420" y2="890" />
    <line x1="420" y1="890" x2="520" y2="780" />
    <line x1="260" y1="820" x2="280" y2="670" stroke-dasharray="4 4" />
  </g>
  <circle cx="120" cy="920" r="9" fill="#7c3aed" fill-opacity="0.25" />
  <circle cx="260" cy="820" r="16" fill="#6d28d9" fill-opacity="0.25" />
  <circle cx="420" cy="890" r="12" fill="#9333ea" fill-opacity="0.3" />
  <circle cx="520" cy="780" r="15" fill="#7c3aed" fill-opacity="0.2" />
  <circle cx="280" cy="670" r="8" fill="#c084fc" fill-opacity="0.35" />

  <!-- Chemical formula subtle watermark text -->
  <text x="1460" y="490" font-family="system-ui, sans-serif" font-weight="700" font-size="28" fill="#7c3aed" fill-opacity="0.08" letter-spacing="4">H₂O · NaCl · CO₂</text>
  <text x="160" y="990" font-family="system-ui, sans-serif" font-weight="700" font-size="24" fill="#9333ea" fill-opacity="0.08" letter-spacing="3">OXIDATION STATE</text>
</svg>
