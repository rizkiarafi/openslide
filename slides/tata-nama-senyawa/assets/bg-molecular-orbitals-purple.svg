<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" fill="none">
  <defs>
    <radialGradient id="orbitalCorePurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9333ea" stop-opacity="0.14" />
      <stop offset="60%" stop-color="#7c3aed" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="purpleRingGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Large Covalent Orbital Watermark (Center-Right) -->
  <g transform="translate(1480, 520)">
    <circle cx="0" cy="0" r="420" fill="url(#orbitalCorePurple)" />

    <!-- Intersecting electron probability lobes (covalent sharing) -->
    <ellipse cx="-70" cy="0" rx="200" ry="110" transform="rotate(-30)" stroke="#7c3aed" stroke-opacity="0.20" stroke-width="2" stroke-dasharray="8 6" />
    <ellipse cx="70" cy="0" rx="200" ry="110" transform="rotate(30)" stroke="#9333ea" stroke-opacity="0.20" stroke-width="2" stroke-dasharray="8 6" />
    <ellipse cx="0" cy="0" rx="280" ry="140" transform="rotate(75)" stroke="#6d28d9" stroke-opacity="0.16" stroke-width="1.8" />
    <ellipse cx="0" cy="0" rx="340" ry="180" transform="rotate(-15)" stroke="#c084fc" stroke-opacity="0.22" stroke-width="1.5" />

    <!-- Shared electron pairs (covalent bond) -->
    <circle cx="-18" cy="-12" r="7" fill="#7c3aed" fill-opacity="0.4" />
    <circle cx="18" cy="12" r="7" fill="#9333ea" fill-opacity="0.4" />

    <!-- Atomic nuclei -->
    <circle cx="-130" cy="0" r="16" fill="#6d28d9" fill-opacity="0.3" stroke="#7c3aed" stroke-opacity="0.5" stroke-width="2" />
    <circle cx="130" cy="0" r="16" fill="#6d28d9" fill-opacity="0.3" stroke="#7c3aed" stroke-opacity="0.5" stroke-width="2" />
  </g>

  <!-- Left watermark chemistry elements -->
  <g transform="translate(140, 160)" stroke="#7c3aed" stroke-opacity="0.16" stroke-width="1.8">
    <polygon points="0,60 52,30 104,60 104,120 52,150 0,120" fill="rgba(124, 58, 237, 0.02)" />
    <polygon points="104,60 156,30 208,60 208,120 156,150 104,120" fill="rgba(147, 51, 234, 0.02)" />
    <circle cx="52" cy="90" r="5" fill="#7c3aed" fill-opacity="0.3" />
    <circle cx="156" cy="90" r="5" fill="#9333ea" fill-opacity="0.3" />
  </g>
</svg>
